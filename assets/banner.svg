<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07152b" />
      <stop offset="100%" stop-color="#0d0914" />
    </linearGradient>

    <!-- Edge Glow Gradients -->
    <radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="purple-glow" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#0000ff" />
    </linearGradient>

    <linearGradient id="text-white" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e6ed" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0.8" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#text-white);
    }
    .accent-title {
      fill: #00f2fe;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #00f2fe;
      letter-spacing: 1.5px;
    }

    /* Animations */
    @keyframes pulse-slow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.05); }
    }
    @keyframes float-node {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes dash-flow {
      to { stroke-dashoffset: -40; }
    }
    @keyframes rotate-shield {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .pulse-bg-1 { animation: pulse-slow 8s infinite ease-in-out; transform-origin: 200px 100px; }
    .pulse-bg-2 { animation: pulse-slow 10s infinite ease-in-out 2s; transform-origin: 1000px 220px; }
    
    .floating-1 { animation: float-node 5s infinite ease-in-out; }
    .floating-2 { animation: float-node 6s infinite ease-in-out 1s; }
    .floating-3 { animation: float-node 7s infinite ease-in-out 2s; }

    .data-stream {
      stroke-dasharray: 8 12;
      animation: dash-flow 2s linear infinite;
    }
    .data-stream-reverse {
      stroke-dasharray: 8 12;
      animation: dash-flow 2.5s linear infinite reverse;
    }
    
    .shield-ring {
      transform-origin: 1050px 160px;
      animation: rotate-shield 20s linear infinite;
    }
  </style>

  <!-- Base Background -->
  <rect width="1200" height="320" fill="url(#bg-grad)" rx="16" />
  
  <!-- Glowing Background Orbs (Low Opacity Ambient Dynamic) -->
  <rect width="1200" height="320" fill="url(#cyan-glow)" class="pulse-bg-1" rx="16" />
  <rect width="1200" height="320" fill="url(#purple-glow)" class="pulse-bg-2" rx="16" />

  <!-- Grid overlay -->
  <rect width="1200" height="320" fill="url(#grid)" rx="16" />

  <!-- BACKGROUND DYNAMIC GRAPHICS (Positioned on sides / behind text with ultra low contrast or kept outside title box) -->
  
  <!-- Left Side: Cloud & Global Network Mesh Nodes -->
  <g opacity="0.35" class="floating-1">
    <!-- Connecting network lines -->
    <path d="M 60 220 L 120 180 L 180 240 L 240 190" fill="none" stroke="#00f2fe" stroke-width="1.5" class="data-stream" />
    <path d="M 120 180 L 200 130 L 280 160" fill="none" stroke="#7928ca" stroke-width="1.5" class="data-stream-reverse" />
    
    <!-- Nodes -->
    <circle cx="60" cy="220" r="4" fill="#00f2fe" />
    <circle cx="120" cy="180" r="6" fill="#4facfe" />
    <circle cx="180" cy="240" r="5" fill="#7928ca" />
    <circle cx="240" cy="190" r="7" fill="#00f2fe" />
    <circle cx="200" cy="130" r="4" fill="#ffffff" />
    <circle cx="280" cy="160" r="6" fill="#7928ca" />
  </g>

  <!-- Right Side: Cybersecurity Shield & CDN Edge Graphic -->
  <g transform="translate(50, 0)">
    <!-- Edge Network Nodes on Right -->
    <g opacity="0.4" class="floating-2">
      <path d="M 850 100 L 920 160 L 880 230 L 980 250 L 1050 160" fill="none" stroke="#00f2fe" stroke-width="1.5" class="data-stream" />
      <circle cx="850" cy="100" r="5" fill="#00f2fe" />
      <circle cx="920" cy="160" r="6" fill="#7928ca" />
      <circle cx="880" cy="230" r="4" fill="#00f2fe" />
      <circle cx="980" cy="250" r="7" fill="#4facfe" />
    </g>

    <!-- Rotating Tech Ring (Behind Shield Icon) -->
    <g class="shield-ring" opacity="0.3">
      <circle cx="1050" cy="160" r="75" fill="none" stroke="#00f2fe" stroke-width="1.5" stroke-dasharray="10 15 25 8" />
      <circle cx="1050" cy="160" r="90" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="4 8 12 16" />
    </g>

    <!-- WAF / Security Shield Graphic Icon -->
    <g transform="translate(1005, 115)" class="floating-3">
      <!-- Outer Glow Shield -->
      <path d="M 45 0 L 85 20 V 55 C 85 82 45 105 45 105 C 45 105 5 82 5 55 V 20 Z" fill="url(#shield-grad)" opacity="0.15" />
      <!-- Inner Shield Stroke -->
      <path d="M 45 5 L 80 23 V 53 C 80 77 45 97 45 97 C 45 97 10 77 10 53 V 23 Z" fill="none" stroke="#00f2fe" stroke-width="2.5" opacity="0.8" />
      <!-- Lock / Security Symbol Inside Shield -->
      <path d="M 35 48 V 40 C 35 34.5 39.5 30 45 30 C 50.5 30 55 34.5 55 40 V 48 M 31 48 H 59 V 68 H 31 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="45" cy="57" r="2.5" fill="#00f2fe" />
    </g>
  </g>

  <!-- Bottom Accent Line with Animated Data Beam -->
  <rect x="0" y="314" width="1200" height="6" fill="#07152b" rx="3" />
  <path d="M 0 317 L 1200 317" fill="none" stroke="url(#title-grad)" stroke-width="4" class="data-stream" />

  <!-- FOREGROUND CONTENT: Title & Subtitle (Guaranteed 100% Clear & Unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 72)">
      <rect x="0" y="0" width="235" height="28" rx="14" fill="#00f2fe" fill-opacity="0.1" stroke="#00f2fe" stroke-opacity="0.3" stroke-width="1" />
      <text x="14" y="18" class="badge-text">⚡ CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="148" class="title">
      Awesome Cloud <tspan class="accent-title">CDN</tspan> &amp; Web <tspan class="accent-title">Security</tspan>
    </text>

    <!-- Subtitle line 1 & 2 -->
    <text x="0" y="195" class="subtitle">
      Enterprise SaaS Platforms &amp; Open-Source Projects for Global Content Delivery,
    </text>
    <text x="0" y="222" class="subtitle">
      Web Application Firewalls (WAF), WAAP, and DDoS Protection at the Edge.
    </text>
    
    <!-- Key Topics Pills -->
    <g transform="translate(0, 248)" opacity="0.9">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="110" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="55" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8" font-weight="600" text-anchor="middle">Cloud CDN</text>
      
      <!-- Pill 2 -->
      <rect x="120" y="0" width="130" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="185" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#c084fc" font-weight="600" text-anchor="middle">Edge WAF / WAAP</text>

      <!-- Pill 3 -->
      <rect x="260" y="0" width="140" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="330" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#4ade80" font-weight="600" text-anchor="middle">DDoS Mitigation</text>

      <!-- Pill 4 -->
      <rect x="410" y="0" width="120" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="470" y="16" font-family="system-ui, sans-serif" font-size="11" fill="#facc15" font-weight="600" text-anchor="middle">Open-Source</text>
    </g>
  </g>
</svg>
