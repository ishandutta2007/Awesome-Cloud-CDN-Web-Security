<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#07152b"/><stop offset="100%" stop-color="#0d0914"/></linearGradient><radialGradient id="cyan-glow" cx="20%" cy="30%" r="60%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".25"/><stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/></radialGradient><radialGradient id="purple-glow" cx="80%" cy="70%" r="60%"><stop offset="0%" stop-color="#7928ca" stop-opacity=".3"/><stop offset="100%" stop-color="#7928ca" stop-opacity="0"/></radialGradient><linearGradient id="title-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="50%" stop-color="#4facfe"/><stop offset="100%" stop-color="#00f"/></linearGradient><linearGradient id="text-white" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#fff"/><stop offset="100%" stop-color="#e0e6ed"/></linearGradient><linearGradient id="shield-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".8"/><stop offset="100%" stop-color="#7928ca" stop-opacity=".8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".03" stroke-width="1" d="M 40 0 L 0 0 0 40"/></pattern></defs><style>@keyframes pulse-slow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.05)}}@keyframes float-node{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes rotate-shield{0%{transform:rotate(0deg)}}.title{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:42px;fill:url(#text-white)}.accent-title{fill:#00f2fe}.badge-text,.subtitle{font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.subtitle{font-weight:400;font-size:19p