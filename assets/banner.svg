ate(50, 0)"><circle cx="1050" cy="160" r="75" fill="none" stroke="#00f2fe" stroke-dasharray="10 15 25 8" stroke-width="1.5"/><circle cx="1050" cy="160" r="90" fill="none" stroke="#7928ca" stroke-dasharray="4 8 12 16" stroke-width="1"/></g><g class="floating-3" transform="translate(50, 0) translate(1005, 115)"><path fill="url(#shield-grad)" d="M 45 0 L 85 20 V 55 C 85 82 45 105 45 105 C 45 105 5 82 5 55 V 20 Z" opacity=".15"/><path fill="none" stroke="#00f2fe" stroke-width="2.5" d="M 45 5 L 80 23 V 53 C 80 77 45 97 45 97 C 45 97 10 77 10 53 V 23 Z" opacity=".8"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M 35 48 V 40 C 35 34.5 39.5 30 45 30 C 50.5 30 55 34.5 55 40 V 48 M 31 48 H 59 V 68 H 31 Z"/><circle cx="45" cy="57" r="2.5" fill="#00f2fe"/></g></g><rect width="1200" height="6" x="0" y="314" fill="#07152b" rx="3"/><path fill="none" stroke="url(#title-grad)" stroke-width="4" d="M 0 317 L 1200 317" class="data-stream"/><g><g transform="translate(80, 0) translate(0, 72)"><rect width="235" height="28" x="0" y="0" fill="#00f2fe" fill-opacity=".1" stroke="#00f2fe" stroke-opacity=".3" stroke-width="1" rx="14"/><text x="14" y="18" class="badge-text">⚡ CURATED AWESOME LIST</text></g><text x="0" y="148" class="title" transform="translate(80, 0)">Awesome Cloud <tspan class="accent-title">CDN</tspan> &amp; Web <tspan class="accent-title">Security</tspan></text><text x="0" y="195" class="subtitle" transform="translate(80, 0)">Enterprise SaaS Platforms &amp; Open-Source Projects for Global Content Delivery,</text><text x="0" y="222" class="subtitle" transform="translate(80, 0)">Web Application Firewalls (WAF), WAAP, and DDoS Protection at the Edge.</text><g opacity=".9" transform="translate(80, 0) translate(0, 248)"><rect width="110" height="24" x="0" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="55" y="16" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Cloud CDN</text><rect width="130" height="24" x="120" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="185" y="16" fill="#c084fc" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Edge WAF / WAAP</text><rect width="140" height="24" x="260" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="330" y="16" fill="#4ade80" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">DDoS Mitigation</text><rect width="120" height="24" x="410" y="0" fill="#1e293b" stroke="#334155" stroke-width="1" rx="6"/><text x="470" y="16" fill="#facc15" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Open-Source</text></g></g></svg>